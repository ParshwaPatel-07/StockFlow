<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="20" fill="#0F172A"/>
  <!-- Cylindrical body -->
  <rect x="30" y="22" width="40" height="56" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <!-- Air grilles -->
  <line x1="38" y1="52" x2="62" y2="52" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="38" y1="58" x2="62" y2="58" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="38" y1="64" x2="62" y2="64" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- Air ring indicator -->
  <ellipse cx="50" cy="30" rx="12" ry="4" fill="#E0F2FE" stroke="#38BDF8" stroke-width="1.5"/>
</svg>